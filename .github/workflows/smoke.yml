name: smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        tier: [default, full]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.tier }}
          repository-cache: true
      - name: bazel build //...
        run: bazel build //... ${{ matrix.tier == 'full' && '--config=full' || '' }}
      - name: bazel test //...
        run: bazel test //... ${{ matrix.tier == 'full' && '--config=full' || '' }}
      - name: lockfiles unchanged
        run: git diff --exit-code
  toolchain-variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-variants
          repository-cache: true
      - name: hermetic LLVM + local JDK
        run: bazel test //... --config=llvm --config=local_jdk
      - name: host gcc
        run: bazel test //cc/... --config=host_gcc
