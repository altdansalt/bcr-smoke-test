# Mirrors the Bazel targets in BUILD.bazel; crate_universe reads this (and
# Cargo.lock) to generate the @crates repository. Not used by cargo directly.
[package]
name = "bcr_smoke_rust"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "hello"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
